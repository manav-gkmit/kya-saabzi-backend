name: Ruff Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-check:
    name: Ruff Lint Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.11.0"

      - name: Ruff check (lint)
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  lint-autofix:
    name: Ruff Lint & Auto-fix
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.11.0"

      - name: Ruff fix (lint + import sort + unused imports)
        run: ruff check . --fix || true

      - name: Ruff format
        run: ruff format .

      - name: Commit lint fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix lint via Ruff [skip ci]"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

      - name: Check for remaining issues
        run: ruff check . --output-format=github
