[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kya-saabzi-backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "Kya Saabzi Backend Service"
dependencies = [
    "alembic==1.17.1",
    "bcrypt==4.3.0",
    "cryptography>=46.0.7",
    "email-validator==2.3.0",
    "fastapi==0.110.2",
    "google-genai>=1.74.0",
    "httpx>=0.28.1,<0.29.0",
    "psycopg[binary]==3.2.12",
    "pydantic>=2.9.0",
    "pydantic-settings==2.2.1",
    "PyJWT==2.12.1",
    "python-dotenv==1.0.1",
    "slowapi==0.1.9",
    "SQLAlchemy==2.0.44",
    "structlog==24.1.0",
    "uvicorn==0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
managed = true
